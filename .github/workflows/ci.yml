name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '26.13.0']
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --package-import-method=clone-or-copy
      - run: node --test scripts/*.test.mjs
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:types
      - name: Pack once and bind the candidate to this source
        run: |
          mkdir .release
          npm pack --ignore-scripts --pack-destination .release
          node scripts/candidate.mjs create .release
      - name: Test the installed tarball without source aliases or consumer patches
        run: node scripts/verify-packed-package.mjs .release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: effect-rstest-candidate-node-${{ matrix.node }}
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
