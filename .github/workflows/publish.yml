name: Publish verified Effect Rstest

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: effect-rstest-publication
  cancel-in-progress: false

jobs:
  qualify:
    if: >-
      github.repository == 'BleedingDev/effect-rstest' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'BleedingDev' &&
      github.triggering_actor == 'BleedingDev'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: qualify
    if: >-
      github.repository == 'BleedingDev/effect-rstest' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'BleedingDev' &&
      github.triggering_actor == 'BleedingDev'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.13.0'
          registry-url: https://registry.npmjs.org/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: effect-rstest-candidate-node-26.13.0
          path: .release/
      - name: Verify and publish only the tested bytes through OIDC
        run: |
          node scripts/candidate.mjs verify .release
          npm publish .release/*.tgz --ignore-scripts --provenance --access public --tag latest --registry=https://registry.npmjs.org/
      - name: Verify registry bytes and provenance availability
        run: node scripts/candidate.mjs registry .release
